<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLMS Nexus — Leave Application</title>
  <style>
    :root {
      --bg: #e8eef5;
      --panel: #ffffff;
      --ink: #1a2b3c;
      --accent: #0b6e4f;
      --danger: #9b2226;
      --line: #c5d0dc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(160deg, #d9e6f2 0%, #eef3f8 45%, #f7fafc 100%);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      padding: 1.5rem 1.25rem 0.5rem;
      max-width: 640px;
      margin: 0 auto;
    }
    header h1 {
      margin: 0;
      font-size: 1.6rem;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 0.35rem 0 0;
      color: #4a5d70;
    }
    main {
      max-width: 640px;
      margin: 1rem auto 2rem;
      padding: 1.25rem;
      background: var(--panel);
      border: 1px solid var(--line);
    }
    label {
      display: block;
      margin: 0.85rem 0 0.3rem;
      font-weight: 600;
      font-size: 0.92rem;
    }
    input, select, textarea, button {
      width: 100%;
      font: inherit;
      padding: 0.55rem 0.65rem;
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    textarea { min-height: 90px; resize: vertical; }
    button {
      margin-top: 1.1rem;
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    .message {
      margin-top: 1rem;
      padding: 0.75rem 0.9rem;
      border: 1px solid var(--line);
    }
    .message.ok { border-color: var(--accent); color: var(--accent); }
    .message.err { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>
  <header>
    <h1>SLMS Nexus</h1>
    <p>Staff Leave Management System — Leave Application</p>
  </header>
  <main>
    <form method="post" action="/">
      <label for="employee_id">Employee</label>
      <select id="employee_id" name="employee_id" required>
        {% for e in employees %}
        <option value="{{ e['EmployeeID'] }}">
          {{ e['FirstName'] }} {{ e['LastName'] }} (Balance: {{ e['AnnualLeaveBalance'] }})
        </option>
        {% endfor %}
      </select>

      <label for="leave_type_id">Leave Type</label>
      <select id="leave_type_id" name="leave_type_id" required>
        {% for t in leave_types %}
        <option value="{{ t['LeaveTypeID'] }}">{{ t['TypeName'] }}</option>
        {% endfor %}
      </select>

      <label for="start_date">Start Date</label>
      <input id="start_date" name="start_date" type="date" required>

      <label for="end_date">End Date</label>
      <input id="end_date" name="end_date" type="date" required>

      <label for="reason">Reason</label>
      <textarea id="reason" name="reason" placeholder="Reason for leave"></textarea>

      <button type="submit">Submit Leave Application</button>
    </form>

    {% if message %}
    <div class="message {{ 'ok' if success else 'err' }}" role="status">
      {{ message }}
    </div>
    {% endif %}
  </main>
</body>
</html>
